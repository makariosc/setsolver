<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Model Precision Bench</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  table { border-collapse: collapse; } td, th { border: 1px solid #ccc; padding: 4px 8px; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
</style>
</head>
<body>
<h1>Model precision bench</h1>
<p>Loads fp32 / fp16 / int8 variants (scripts/quantize_models.py) on WebGPU and WASM, times them, and
compares them with fp32 (same backend) on real card crops and photos. <span id="status">running…</span></p>
<table id="out"><tr><th>model</th><th>backend</th><th>load ms</th><th>run ms (median of 5)</th><th>max |diff| vs fp32</th><th>error</th></tr></table>
<script type="module">
import * as ort from "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/ort.webgpu.min.mjs";
ort.env.wasm.wasmPaths = "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.30.0/dist/";
ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 4) : 1;

const variants = new URLSearchParams(location.search).get("v")?.split(",") ?? ["fp32", "fp16", "int8dyn", "int8qdq"];
const models = new URLSearchParams(location.search).get("m")?.split(",") ?? ["detector", "classifier"];
const backendsToTest = new URLSearchParams(location.search).get("b")?.split(",") ?? ["webgpu", "wasm"];
// ?dir=models/variants/v3 benchmarks a candidate export (fp32 at <dir>/, variants at <dir>/variants/)
const dir = new URLSearchParams(location.search).get("dir") ?? "models";
const file = (m, v) => v === "fp32" ? `${dir}/${m}.onnx` : `${dir}/variants/${m}_${v}.onnx`;
// real inputs from the setchecker sample photos (written next to the variants): card crops and
// letterboxed photos, RGB uint8 -> NCHW float 0..1
const info = await (await fetch("models/variants/bench_inputs.json")).json();
const u8 = async (f) => new Uint8Array(await (await fetch(`models/variants/${f}`)).arrayBuffer());
const nchw = (src, n, h, w) => { const o = new Float32Array(n * 3 * h * w), hw = h * w;
  for (let i = 0; i < n; i++) for (let p = 0; p < hw; p++) for (let c = 0; c < 3; c++) o[i * 3 * hw + c * hw + p] = src[(i * hw + p) * 3 + c] / 255;
  return o; };
const crops = nchw(await u8("bench_crops.u8"), info.crops, 256, 160);
const dets = nchw(await u8("bench_dets.u8"), info.dets, 640, 640);
const detInput = (i) => new ort.Tensor("float32", dets.subarray(i * 3 * 640 * 640, (i + 1) * 3 * 640 * 640), [1, 3, 640, 640]);
const clsInput = (i, n) => new ort.Tensor("float32", crops.subarray(i * 3 * 256 * 160, (i + n) * 3 * 256 * 160), [n, 3, 256, 160]);
// greedy NMS count at a threshold, same as pipeline.js
const iou = (a, b) => { const ix = Math.max(0, Math.min(a[2], b[2]) - Math.max(a[0], b[0])), iy = Math.max(0, Math.min(a[3], b[3]) - Math.max(a[1], b[1])), i = ix * iy;
  return i / ((a[2] - a[0]) * (a[3] - a[1]) + (b[2] - b[0]) * (b[3] - b[1]) - i + 1e-9); };
const count = (d, conf) => { const n = 8400, cand = [], keep = [];
  for (let j = 0; j < n; j++) if (d[4 * n + j] >= conf) cand.push({ s: d[4 * n + j], b: [d[j] - d[2 * n + j] / 2, d[n + j] - d[3 * n + j] / 2, d[j] + d[2 * n + j] / 2, d[n + j] + d[3 * n + j] / 2] });
  cand.sort((p, q) => q.s - p.s); for (const c of cand) if (keep.every((k) => iou(k.b, c.b) < 0.7)) keep.push(c); return keep.length; };

const results = [];
const ref = {};
const row = (cells) => { const tr = document.createElement("tr"); tr.innerHTML = cells.map((c) => `<td>${c}</td>`).join(""); document.getElementById("out").append(tr); };
document.querySelector("tr").innerHTML = "<th>model</th><th>backend</th><th>load ms</th><th>run ms</th><th>vs fp32 on real inputs</th><th>error</th>";

for (const backend of backendsToTest) {
  for (const m of models) {
    for (const v of variants) {
      const r = { model: `${m}_${v}`, backend };
      try {
        const bytes = new Uint8Array(await (await fetch(file(m, v))).arrayBuffer());
        let t = performance.now();
        const s = await ort.InferenceSession.create(bytes, { executionProviders: [backend], graphOptimizationLevel: "all" });
        r.load = performance.now() - t;
        const run = async (x) => (await s.run({ [s.inputNames[0]]: x }))[s.outputNames[0]].data;
        const timing = m === "detector" ? detInput(0) : clsInput(0, 12);
        await run(timing);
        const ts = [];
        for (let i = 0; i < 5; i++) { t = performance.now(); await run(timing); ts.push(performance.now() - t); }
        r.run = ts.sort((a, b) => a - b)[2];
        const key = `${m}_${backend}`;
        if (m === "detector") {
          const outs = []; for (let i = 0; i < info.dets; i++) outs.push(Float32Array.from(await run(detInput(i))));
          if (v === "fp32") ref[key] = outs;
          let dScore = 0, dCount = 0, cards = 0;
          outs.forEach((o, i) => { const R = ref[key][i];
            for (let j = 0; j < 8400; j++) if (R[4 * 8400 + j] > 0.3 || o[4 * 8400 + j] > 0.3) dScore = Math.max(dScore, Math.abs(o[4 * 8400 + j] - R[4 * 8400 + j]));
            const c = count(o, 0.5); cards += c; dCount += c !== count(R, 0.5) || count(o, 0.85) !== count(R, 0.85); });
          r.cmp = `${info.dets} photos, ${cards} cards; photos with different count: ${dCount}; max score diff ${dScore.toFixed(3)}`;
        } else {
          const probs = []; for (let i = 0; i < info.crops; i += 31) probs.push(...Array.from(await run(clsInput(i, Math.min(31, info.crops - i)))));
          if (v === "fp32") ref[key] = probs;
          const R = ref[key]; let dis = 0, flips = 0, dp = 0;
          for (let c = 0; c < info.crops; c++) {
            let minP = 1, minR = 1, differ = false;
            for (let a = 0; a < 4; a++) { const o = c * 12 + a * 3, am = (x) => [0, 1, 2].reduce((b, k) => x[o + k] > x[o + b] ? k : b, 0);
              differ ||= am(probs) !== am(R); minP = Math.min(minP, probs[o + am(probs)]); minR = Math.min(minR, R[o + am(R)]);
              for (let k = 0; k < 3; k++) dp = Math.max(dp, Math.abs(probs[o + k] - R[o + k])); }
            dis += differ; flips += (minP >= 0.85) !== (minR >= 0.85);
          }
          r.cmp = `${info.crops} cards; different prediction: ${dis}; crossing 0.85: ${flips}; max prob diff ${dp.toFixed(3)}`;
        }
        await s.release();
      } catch (e) { r.error = String(e.message || e).slice(0, 200); }
      results.push(r);
      row([r.model, backend, r.load?.toFixed(0) ?? "", r.run?.toFixed(1) ?? "", r.cmp ?? "", r.error ?? ""]);
    }
  }
}
window.benchResult = results;
document.getElementById("status").textContent = "done";
</script>
</body>
</html>
