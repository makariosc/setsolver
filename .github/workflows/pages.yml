# Publish the browser app (web/) to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy web app to Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set-finding and geometry tests
        run: node web/tests/test.mjs
      - name: Assemble site
        # the app plus the models meta.json names; dev-only pages/tests stay out
        run: |
          mkdir -p _site/models
          cp -r web/index.html web/app.css web/js _site/
          cp web/models/meta.json _site/models/
          for f in $(python3 -c "import json; m=json.load(open('web/models/meta.json')); print(m['detector']['file'], m['classifier']['file'])"); do
            cp "web/models/$f" _site/models/
          done
          ls -laR _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
